name: Deploy cross-tab demo

# Manual only: click "Run workflow" in the Actions tab.
# One-time setup (see cross-tab-demo/README.md):
#   - create an empty Docker Space on huggingface.co
#   - repo secret  HF_TOKEN  = a Hugging Face token with write access
#   - repo variable HF_SPACE = <hf-username>/<space-name>
on:
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Install just"
        uses: extractions/setup-just@v3

      - name: "Install uv"
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: "Install python"
        run: uv python install

      - name: "Install dependencies"
        run: uv sync --locked

      - name: "Download speech model"
        run: uv run python cross-tab-demo/download_model.py

      - name: "Lint Check"
        run: just lint

      - name: "Format Check"
        run: uv run ruff format --check .

      - name: "Type Check"
        run: just typecheck

      - name: "Tests"
        run: just test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      HF_SPACE: ${{ vars.HF_SPACE }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Check deploy configuration"
        run: |
          if [ -z "$HF_SPACE" ] || [ -z "$HF_TOKEN" ]; then
            echo "::error::Set the HF_SPACE repository variable and HF_TOKEN secret first."
            exit 1
          fi

      - name: "Assemble Space bundle"
        run: |
          mkdir bundle
          cp cross-tab-demo/deploy/Dockerfile cross-tab-demo/deploy/requirements.txt bundle/
          cp cross-tab-demo/deploy/SPACE_README.md bundle/README.md
          cp cross-tab-demo/server.py cross-tab-demo/download_model.py bundle/
          cp -r cross-tab-demo/static bundle/static

      - name: "Verify the image builds"
        run: docker build -t cross-tab-demo bundle

      - name: "Push bundle to Hugging Face"
        working-directory: bundle
        run: |
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main

      - name: "Wait for the Space to respond"
        run: |
          host=$(echo "$HF_SPACE" | tr 'A-Z/_.' 'a-z--')
          url="https://${host}.hf.space/"
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null "$url"; then
              echo "Live at $url"
              echo "### Deployed :rocket: $url" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "::error::$url did not respond within 10 minutes"
          exit 1
