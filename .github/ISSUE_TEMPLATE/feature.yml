name: Feature request
description: Propose a new feature or enhancement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or user need
      description: What problem does this solve, and for who? Describe the need, not the solution.
      placeholder: "e.g. API clients cannot filter users by account status."
    validations:
      required: true
  - type: textarea
    id: proposed-behavior
    attributes:
      label: Proposed behavior
      description: How should the feature behave? What does the user see and do?
      placeholder: "e.g. Accept an optional status query parameter on the user list endpoint."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered and why you didn't choose them.
      placeholder: "e.g. A separate endpoint was considered, but a query parameter keeps the existing resource model."
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in scope for this issue, and explicitly what is out of scope.
      placeholder: |
        In scope: filtering by one account status.
        Out of scope: combining filters or changing pagination.
    validations:
      required: false
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: What outcome, when tested, shows this feature is complete?
      placeholder: |
        - A valid status returns only matching users.
        - An unsupported status returns a 422 response.
      render: markdown
    validations:
      required: false
  - type: textarea
    id: mockups
    attributes:
      label: Mockups or references
      description: Links to mockups, sketches, or similar features elsewhere. Drag and drop images here.
    validations:
      required: false
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and discussions and this hasn't already been proposed.
          required: true
